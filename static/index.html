<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Progress Monitor — Indonesia</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea; --text: #1a1d21;
    --muted: #6b7280; --accent: #c8102e; --accent-soft: #fdecef;
    --red: #c8102e; --amber: #b45309; --amber-soft: #fef3c7;
    --slate: #475569; --slate-soft: #eef2f6; --green: #15803d;
    --blue: #1d4ed8; --blue-soft: #dbeafe; --violet: #6d28d9; --violet-soft: #ede9fe;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --border: #262c34; --text: #e8eaed;
      --muted: #9aa4b2; --accent: #ff5a70; --accent-soft: #2a1419;
      --red: #ff5a70; --amber: #fbbf24; --amber-soft: #2e2410;
      --slate: #cbd5e1; --slate-soft: #1e242c; --green: #4ade80;
      --blue: #93b4fd; --blue-soft: #16233d; --violet: #c4b5fd; --violet-soft: #241b3d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; }
  main { padding: 20px 24px 60px; max-width: 1500px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; cursor: pointer; text-align: left; box-shadow: var(--shadow);
    transition: border-color .12s, transform .12s; color: inherit; font: inherit;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .card .n { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
  .card .l { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .card .h { color: var(--muted); font-size: 11.5px; margin-top: 6px; line-height: 1.35; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  select, input[type=search], button {
    font: inherit; padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  input[type=search] { min-width: 240px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
  button:disabled { opacity: .55; cursor: progress; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; min-width: 1000px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--slate-soft); }
  .subj { font-weight: 550; max-width: 380px; }
  .desc { color: var(--muted); font-size: 12px; margin-top: 3px; max-width: 380px;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nowrap { white-space: nowrap; }
  .badge { display: inline-block; padding: 1.5px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; margin: 1px 3px 1px 0; white-space: nowrap; }
  .b-over { background: var(--accent-soft); color: var(--red); }
  .b-never { background: var(--amber-soft); color: var(--amber); }
  .b-stale { background: var(--slate-soft); color: var(--slate); }
  .b-nodue { background: var(--slate-soft); color: var(--slate); }
  a { color: var(--accent); }
  .empty, .loading { padding: 40px; text-align: center; color: var(--muted); }
  .err { background: var(--accent-soft); color: var(--red); border: 1px solid var(--red);
         padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 14px; border: none; background: none; color: var(--muted);
         border-bottom: 2px solid transparent; border-radius: 0; font-weight: 550; cursor: pointer; font: inherit; }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .t-must { background: var(--accent); color: #fff; }
  .t-hyper { background: var(--violet-soft); color: var(--violet); }
  .t-strat { background: var(--blue-soft); color: var(--blue); }
  /* --- tag groups (Hypercare / Strategic, Must Win) --- */
  .tag-group { margin-bottom: 22px; }
  .tag-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .tag-group-count { color: var(--muted); font-size: 12.5px; }
  /* --- opportunity cards --- */
  .opp { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
         box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 12px; }
  .opp-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .opp-title { font-size: 16px; font-weight: 650; letter-spacing: -.01em; flex: 1 1 320px; }
  .opp-title .oid { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .opp-tags { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .opp-meta { margin-top: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
              color: var(--muted); font-size: 13px; display: flex; gap: 20px; flex-wrap: wrap; }
  .opp-meta b { color: var(--text); font-weight: 600; }
  .opp-tasks { margin-top: 10px; }
  .opp-tasks h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .05em; color: var(--muted);
                  text-transform: uppercase; font-weight: 600; }
  .tk { display: flex; gap: 12px; padding: 5px 0 5px 10px; border-left: 2px solid var(--border); }
  .tk.od { border-left-color: var(--accent); }
  .tk-date { min-width: 88px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .tk-date.none { color: var(--muted); font-weight: 400; }
  .tk-body { flex: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .tk-text { flex: 1; min-width: 0; }
  .tk-sub { font-size: 13.5px; }
  .tk-meta { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .rid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end;
           padding: 10px 4px 0; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .pager button { padding: 5px 11px; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .del-toggle { padding: 3px 11px; border-radius: 20px; border: 1px solid var(--border);
                background: var(--panel); color: var(--muted); font: inherit; font-size: 11.5px;
                font-weight: 700; letter-spacing: .02em; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
  .del-toggle:hover { border-color: var(--accent); }
  .del-toggle.yes { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .admin-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px;
                 background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .admin-label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Task Progress Monitor — Indonesia Team</h1>
  <div class="sub" id="meta">Loading…</div>
  <div class="sub" id="scopeNote"></div>
</header>

<main>
  <div id="error" class="err" hidden></div>

  <div class="cards" id="cards"></div>

  <div class="tabs">
    <button class="tab" data-view="tasks" aria-selected="true">Task List</button>
    <button class="tab" data-view="alex" aria-selected="false">Alex Direction</button>
    <button class="tab" data-view="hs" aria-selected="false">Hypercare / Strategic</button>
    <button class="tab" data-view="mustwin" aria-selected="false">Must Win</button>
    <button class="tab" data-view="creators" aria-selected="false">By Creator</button>
  </div>

  <div class="admin-panel" id="rosterAdmin" hidden>
    <label class="admin-label">Manager roster (Name/ASM/Email CSV)
      <input type="file" id="rosterFile" accept=".csv">
    </label>
    <button id="rosterUpload">Upload roster</button>
    <span class="sub" id="rosterStatus"></span>
  </div>

  <div class="controls">
    <label>Stale threshold
      <select id="staleDays">
        <option value="7">7 days</option>
        <option value="14" selected>14 days</option>
        <option value="30">30 days</option>
      </select>
    </label>
    <select id="owner"><option value="">All Task Owners</option></select>
    <select id="manager"><option value="">All Managers</option></select>
    <select id="taskType">
      <option value="Task" selected>Type: Task</option>
      <option value="Note">Type: Note</option>
      <option value="all">Type: All</option>
    </select>
    <select id="sort">
      <option value="last_touched">Sort: Longest untouched</option>
      <option value="due_date">Sort: Due date</option>
      <option value="created_at">Sort: Newest created</option>
      <option value="subject">Sort: Subject</option>
    </select>
    <input type="search" id="q" placeholder="Search subject, description, client…">
    <select id="pageSize">
      <option value="25">25 / page</option>
      <option value="50" selected>50 / page</option>
      <option value="100">100 / page</option>
    </select>
    <button id="refresh" class="primary">Sync from CRM</button>
    <button id="csv">Export CSV</button>
  </div>

  <div class="tablewrap">
    <div id="view"><div class="loading">Loading…</div></div>
  </div>
  <div class="pager" id="pager"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const state = { bucket: null, view: "tasks", staleDays: 14, owner: "", manager: "", taskType: "Task", sort: "last_touched", q: "", page: 1, pageSize: 50 };

// Delete marks are shared, server-persisted state ("flag this for someone to delete in
// CRM") — every viewer of the dashboard sees the same marks (unlike the static artifact
// report's per-browser localStorage version). Not wired to any actual CRM write, since
// CRM_WRITE_ENABLED is off; see CLAUDE.md.
async function toggleDelete(id, currentlyMarked) {
  try {
    await fetch(`/api/tasks/${id}/delete-mark`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ marked: !currentlyMarked }),
    });
  } catch {}
  render();
}
function deleteToggleHtml(t) {
  const marked = !!t.delete_marked;
  return `<button type="button" class="del-toggle ${marked ? "yes" : ""}" data-del-id="${t.id}"
            data-del-marked="${marked}" aria-pressed="${marked}" title="Flag for deletion in CRM">${marked ? "Yes" : "No"}</button>`;
}
// Event delegation on the one container that survives every render.
$("#view").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-del-id]");
  if (btn) toggleDelete(btn.dataset.delId, btn.dataset.delMarked === "true");
});

const CARDS = [
  { key: "never_updated", label: "Never Updated", hint: "No changes since the task was created" },
  { key: "stale",         label: "Stale",          hint: "Updated before, but stalled past the threshold" },
  { key: "overdue",       label: "Overdue",        hint: "Due date has passed, status not yet Completed" },
  { key: "no_due_date",   label: "No Due Date",    hint: "Open tasks that don't have a deadline yet" },
];

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function qs(extra = {}) {
  const p = new URLSearchParams({ stale_days: state.staleDays, ...extra });
  return p.toString();
}

async function loadSummary() {
  const r = await fetch(`/api/summary?${qs()}`);
  const d = await r.json();
  const counts = d.counts;

  $("#cards").innerHTML = CARDS.map((c) => `
    <button class="card" data-bucket="${c.key}" aria-pressed="${state.bucket === c.key}">
      <div class="n">${counts[c.key] ?? 0}</div>
      <div class="l">${c.label}</div>
      <div class="h">${c.hint}</div>
    </button>`).join("");

  $("#cards").querySelectorAll(".card").forEach((el) => {
    el.onclick = () => {
      state.bucket = state.bucket === el.dataset.bucket ? null : el.dataset.bucket;
      state.page = 1;
      loadSummary(); render();
    };
  });

  const synced = d.last_sync_at ? new Date(d.last_sync_at).toLocaleString("en-GB") : "never";
  $("#meta").textContent =
    `${counts.open} open tasks out of ${counts.total} stored · last synced: ${synced}` +
    (state.bucket ? ` · filter: ${CARDS.find((c) => c.key === state.bucket).label}` : "");

  if (!d.crm_configured) showError("CRM is not configured. Fill in CRM_API_BASE_URL and CRM_API_KEY in backend/.env and restart.");
  else if (d.last_sync_error) showError("Last sync failed: " + d.last_sync_error);
  else hideError();
}

async function loadViewerScope() {
  const r = await fetch("/api/me");
  const d = await r.json();
  const el = $("#scopeNote");
  if (d.mode === "self") el.textContent = `Viewing as ${d.viewer_name} · only your own tasks`;
  else if (d.mode === "team") el.textContent = `Viewing as ${d.viewer_name} · your team's tasks (${d.team_size} people, including you)`;
  else el.textContent = "";
  $("#rosterAdmin").hidden = !d.is_roster_admin;
}

$("#rosterUpload").onclick = async () => {
  const input = $("#rosterFile");
  const status = $("#rosterStatus");
  if (!input.files.length) { status.textContent = "Please choose a CSV file first."; return; }

  const fd = new FormData();
  fd.append("file", input.files[0]);
  $("#rosterUpload").disabled = true;
  status.textContent = "Uploading…";
  try {
    const r = await fetch("/api/manager-roster", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) { status.textContent = "Failed: " + (d.detail || r.status); return; }
    const gap = (d.names_without_email || []).length;
    status.textContent = `Success: ${d.names} names updated` +
      (gap ? ` · ${gap} names without Email (can't be mapped to SSO yet)` : "");
    input.value = "";
    await loadFilterOptions();
  } catch (e) {
    status.textContent = "Failed: " + e.message;
  } finally {
    $("#rosterUpload").disabled = false;
  }
};

function showError(msg) { $("#error").textContent = msg; $("#error").hidden = false; }
function hideError() { $("#error").hidden = true; }

// "Last updated" falls back to created_at when a task has no real updated_at
// (never_updated=true) — see buckets.py's last_touched_at. Left unlabeled, a task
// created 36 days ago and never touched since reads as "36d ago" exactly like a task
// genuinely edited 36 days ago, which looks like it should be Stale but never can be
// (the two buckets are mutually exclusive by design). Spell out which case it is.
function touchLabel(f) {
  if (f.days_since_touch == null) return "—";
  return f.never_updated
    ? `Created ${f.days_since_touch}d ago (never edited)`
    : `${f.days_since_touch}d ago`;
}

function badges(f) {
  let out = "";
  if (f.overdue) out += `<span class="badge b-over">Overdue ${f.days_overdue ?? 0}d</span>`;
  if (f.never_updated) out += `<span class="badge b-never">Never updated</span>`;
  if (f.stale) out += `<span class="badge b-stale">Stale ${f.days_since_touch}d</span>`;
  if (f.no_due_date) out += `<span class="badge b-nodue">No due date</span>`;
  return out || "—";
}

async function fetchDecorated(extra = {}) {
  const params = { task_type: state.taskType, sort: state.sort };
  if (state.bucket) params.bucket = state.bucket;
  if (state.owner) params.owner = state.owner;
  if (state.manager) params.manager = state.manager;
  if (state.q) params.q = state.q;
  Object.assign(params, extra);
  const r = await fetch(`/api/tasks?${qs(params)}`);
  const d = await r.json();
  return d.items;
}

function taskRowsHtml(items) {
  if (!items.length) { $("#pager").innerHTML = ""; return `<div class="empty">No tasks match this filter.</div>`; }

  const pages = Math.max(1, Math.ceil(items.length / state.pageSize));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * state.pageSize;
  const rows = items.slice(start, start + state.pageSize);
  renderPager(items.length, pages, start, rows.length);

  return `
    <table>
      <thead><tr>
        <th>ID</th><th>Subject</th><th>Task Owner</th><th>Manager</th><th>Client / Opportunity</th><th>Status</th>
        <th class="nowrap">Due date</th><th class="nowrap">Last updated</th><th>Flags</th><th></th><th>Delete Yes / No</th>
      </tr></thead>
      <tbody>${rows.map((t) => `
        <tr>
          <td class="rid nowrap">${t.id}</td>
          <td><div class="subj">${esc(t.subject) || "(no subject)"}</div>
              ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ""}</td>
          <td class="nowrap">${esc(t.owner_name)}</td>
          <td class="nowrap">${esc(t.manager)}</td>
          <td>${esc(t.account_name || t.opportunity_name || "—")}</td>
          <td class="nowrap">${esc(t.status || "—")}</td>
          <td class="nowrap">${fmtDate(t.flags.due_at)}</td>
          <td style="max-width:170px">${touchLabel(t.flags)}</td>
          <td>${badges(t.flags)}</td>
          <td class="nowrap">${t.crm_link ? `<a href="${esc(t.crm_link)}" target="_blank" rel="noopener">Open in CRM</a>` : ""}</td>
          <td class="nowrap">${deleteToggleHtml(t)}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
}

function renderPager(total, pages, start, shown) {
  $("#pager").innerHTML = `
    <span>Showing ${start + 1}–${start + shown} of ${total}</span>
    <button id="pPrev" ${state.page <= 1 ? "disabled" : ""}>← Previous</button>
    <span>Page ${state.page} / ${pages}</span>
    <button id="pNext" ${state.page >= pages ? "disabled" : ""}>Next →</button>`;
  const prev = $("#pPrev"), next = $("#pNext");
  if (prev) prev.onclick = () => { state.page--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  if (next) next.onclick = () => { state.page++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

async function renderTasks() {
  $("#view").innerHTML = taskRowsHtml(await fetchDecorated());
}

// "Alex Direction" replicates the CRM habit of filtering by "subject contains Alex
// Direction" — same table/controls as Daftar Task, just a pre-narrowed base list.
async function renderAlex() {
  $("#view").innerHTML = taskRowsHtml(await fetchDecorated({ alex_direction: true }));
}

// ---------------------------------------------------------- opportunity grouping

function tagChip(t) {
  const cls = t === "MUST WIN" ? "t-must" : t === "HYPERCARE" ? "t-hyper" : "t-strat";
  return `<span class="badge ${cls}">${esc(t)}</span>`;
}

// Same severity order used everywhere a priority list needs sorting: worst-overdue first,
// then busiest.
function sortBySeverity(list) {
  return list.slice().sort((a, b) => (b.overdueCount - a.overdueCount) || (b.taskCount - a.taskCount));
}

function groupByOpportunity(items) {
  const map = new Map();
  for (const t of items) {
    const id = t.related_record_id;
    if (t.related_object_type !== "Opportunity" || id == null) continue;
    if (!map.has(id)) {
      map.set(id, {
        id, name: t.opportunity_name, account: t.account_name, stage: t.opportunity_stage,
        owner: t.owner_name, tags: t.tags || [], tasks: [], taskCount: 0, overdueCount: 0,
      });
    }
    const o = map.get(id);
    o.tasks.push(t);
    o.taskCount++;
    if (t.flags.overdue) o.overdueCount++;
  }
  return [...map.values()];
}

function oppCardHtml(o) {
  return `
    <section class="opp">
      <div class="opp-head">
        <div class="opp-title">${esc(o.name) || "(no name)"}<span class="oid">#${o.id}</span></div>
        <div class="opp-tags">${(o.tags || []).map(tagChip).join("")}</div>
      </div>
      <div class="opp-meta">
        <span>Client: <b>${esc(o.account) || "—"}</b></span>
        <span>Stage: <b>${esc(o.stage) || "—"}</b></span>
        <span>Owner: <b>${esc(o.owner) || "—"}</b></span>
      </div>
      <div class="opp-tasks">
        <h4>Tasks (${o.taskCount})</h4>
        ${o.tasks.map((t) => `
          <div class="tk ${t.flags.overdue ? "od" : ""}">
            <div class="tk-date ${t.flags.due_at ? "" : "none"}">${t.flags.due_at ? fmtDate(t.flags.due_at) : "no due date"}</div>
            <div class="tk-body">
              <div class="tk-text">
                <div class="tk-sub">${esc(t.subject) || "(no subject)"}
                  <span style="color:var(--muted)">(${esc(t.status)})</span></div>
                <div class="tk-meta"><span class="rid">#${t.id}</span> · Owner: ${esc(t.owner_name)} · Manager: ${esc(t.manager)}${badges(t.flags) !== "—" ? " · " + badges(t.flags) : ""}</div>
              </div>
              ${deleteToggleHtml(t)}
            </div>
          </div>`).join("")}
      </div>
    </section>`;
}

// Everything tagged HYPERCARE or STRATEGIC, grouped by opportunity. Hypercare-tagged
// opportunities sit in the top block regardless of whether they're also Strategic (their
// chips show both); the bottom block is what's left — Strategic-only, no Hypercare.
async function renderHypercareStrategic() {
  $("#pager").innerHTML = "";
  const items = await fetchDecorated({ bucket: state.bucket || "open" });
  const opps = groupByOpportunity(items).filter((o) => o.tags.includes("HYPERCARE") || o.tags.includes("STRATEGIC"));
  if (!opps.length) { $("#view").innerHTML = `<div class="empty">No Hypercare/Strategic-tagged opportunities match.</div>`; return; }
  const top = sortBySeverity(opps.filter((o) => o.tags.includes("HYPERCARE")));
  const rest = sortBySeverity(opps.filter((o) => !o.tags.includes("HYPERCARE")));
  const block = (label, group) => !group.length ? "" : `
    <div class="tag-group">
      <div class="tag-group-head">${tagChip(label)}<span class="tag-group-count">${group.length} opportunities</span></div>
      ${group.map(oppCardHtml).join("")}
    </div>`;
  $("#view").innerHTML = block("HYPERCARE", top) + block("STRATEGIC", rest);
}

// Everything tagged MUST WIN, flat — no sub-grouping. Cards still show whichever other
// tags (Hypercare/Strategic) an opportunity happens to also carry.
async function renderMustWin() {
  $("#pager").innerHTML = "";
  const items = await fetchDecorated({ bucket: state.bucket || "open" });
  const opps = sortBySeverity(groupByOpportunity(items).filter((o) => o.tags.includes("MUST WIN")));
  if (!opps.length) { $("#view").innerHTML = `<div class="empty">No Must Win-tagged opportunities match.</div>`; return; }
  $("#view").innerHTML = opps.map(oppCardHtml).join("");
}

async function renderCreators() {
  $("#pager").innerHTML = "";
  const r = await fetch(`/api/creators?${qs()}`);
  const d = await r.json();
  if (!d.items.length) { $("#view").innerHTML = `<div class="empty">No data yet.</div>`; return; }

  $("#view").innerHTML = `
    <table>
      <thead><tr>
        <th>Creator</th><th>Total</th><th>Open</th><th>Never Updated</th>
        <th>Stale</th><th>Overdue</th><th>No Due Date</th>
      </tr></thead>
      <tbody>${d.items.map((c) => `
        <tr>
          <td>${esc(c.name)}</td><td>${c.total}</td><td>${c.open}</td>
          <td>${c.never_updated}</td><td>${c.stale}</td>
          <td>${c.overdue}</td><td>${c.no_due_date}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
}

// Task Owner and Manager filter options are both derived from the same set of open Task
// rows — one fetch, two tallies — rather than a dedicated /api/owners endpoint.
async function loadFilterOptions() {
  const r = await fetch(`/api/tasks?${qs({ task_type: "Task", bucket: "open" })}`);
  const d = await r.json();

  const ownerCounts = new Map();
  const managerCounts = new Map();
  for (const t of d.items) {
    ownerCounts.set(t.owner_name, (ownerCounts.get(t.owner_name) || 0) + 1);
    managerCounts.set(t.manager, (managerCounts.get(t.manager) || 0) + 1);
  }

  const ownerSel = $("#owner");
  ownerSel.innerHTML = `<option value="">All Task Owners</option>` +
    [...ownerCounts.entries()].sort((a, b) => b[1] - a[1])
      .map(([name, n]) => `<option value="${esc(name)}">${esc(name)} (${n})</option>`).join("");
  ownerSel.value = state.owner;

  // "No Manager" (the backend's NO_MANAGER placeholder) sinks to the bottom regardless
  // of count — it's a catch-all, not a real manager, so it shouldn't compete for the
  // top spot by volume.
  const managerSel = $("#manager");
  managerSel.innerHTML = `<option value="">All Managers</option>` +
    [...managerCounts.entries()].sort((a, b) =>
      (a[0] === "No Manager") - (b[0] === "No Manager") || b[1] - a[1])
      .map(([name, n]) => `<option value="${esc(name)}">${esc(name)} (${n})</option>`).join("");
  managerSel.value = state.manager;
}

const VIEWS = { tasks: renderTasks, alex: renderAlex, hs: renderHypercareStrategic, mustwin: renderMustWin, creators: renderCreators };
function render() { return VIEWS[state.view](); }

async function refreshAll() { await loadSummary(); await loadViewerScope(); await loadFilterOptions(); await render(); }

document.querySelectorAll(".tab").forEach((tab) => {
  tab.onclick = () => {
    state.view = tab.dataset.view;
    state.page = 1;
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
    render();
  };
});

$("#staleDays").onchange = (e) => { state.staleDays = +e.target.value; state.page = 1; refreshAll(); };
$("#owner").onchange = (e) => { state.owner = e.target.value; state.page = 1; render(); };
$("#manager").onchange = (e) => { state.manager = e.target.value; state.page = 1; render(); };
$("#taskType").onchange = (e) => { state.taskType = e.target.value; state.page = 1; render(); };
$("#sort").onchange = (e) => { state.sort = e.target.value; state.page = 1; render(); };
$("#pageSize").onchange = (e) => { state.pageSize = +e.target.value; state.page = 1; render(); };

let timer;
$("#q").oninput = (e) => { clearTimeout(timer); state.q = e.target.value; state.page = 1; timer = setTimeout(render, 220); };

$("#refresh").onclick = async (e) => {
  e.target.disabled = true; e.target.textContent = "Syncing…";
  try {
    const r = await fetch("/api/sync", { method: "POST" });
    if (!r.ok) showError("Sync failed: " + ((await r.json()).detail || r.status));
    await refreshAll();
  } finally {
    e.target.disabled = false; e.target.textContent = "Sync from CRM";
  }
};

$("#csv").onclick = () => {
  const p = { task_type: state.taskType };
  if (state.bucket) p.bucket = state.bucket;
  window.location = `/api/export.csv?${qs(p)}`;
};

refreshAll();
</script>
</body>
